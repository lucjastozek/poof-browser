[package]
name = "poof"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.34"
wry = "0.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
url = "2"
log = "0.4"
env_logger = "0.11"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
resvg = "0.45"

# Windows only: raw WebView2 access (extensions + gesture-enabled JS for auto-PiP).
# IMPORTANT: these two versions must match the ones wry resolves to.
# Check with: cargo tree -i webview2-com   /   cargo tree -i windows
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
