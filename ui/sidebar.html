<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>poof</title>
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src http: https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      /*THEME*/
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font: 13px/1.4 var(--f-text);
        color: var(--ink);
        user-select: none;
        background: var(--chrome);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 0;
      }
      svg {
        display: block;
        flex: none;
      }
      * { scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--ink) 24%,transparent) transparent; }
      *::-webkit-scrollbar { width:6px; height:6px; }
      *::-webkit-scrollbar-track { background:transparent; }
      *::-webkit-scrollbar-thumb { background:color-mix(in srgb,var(--ink) 22%,transparent); border-radius:99px; }
      *::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb,var(--ink) 36%,transparent); }
      *::-webkit-scrollbar-button { display:none; width:0; height:0; }
      :focus-visible {
        outline: 2px solid color-mix(in srgb, var(--space) 70%, var(--ink));
        outline-offset: 1px;
      }
      input:focus-visible {
        outline: 0;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-family: var(--f-display);
        font-weight: 600;
        letter-spacing: -0.015em;
      }

      /* ---------- shared components ---------- */
      .ib {
        width: 28px;
        height: 28px;
        border-radius: var(--r-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-2);
        transition:
          background 0.12s,
          color 0.12s;
      }
      .ib:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .ib:active {
        background: var(--pressed);
      }
      .btn {
        height: 34px;
        padding: 0 14px;
        border-radius: var(--r-md);
        border: 1px solid var(--line-2);
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition:
          background 0.12s,
          border-color 0.12s;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:active {
        background: var(--pressed);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 86%, var(--accent-ink));
      }
      .btn.ghost {
        border-color: transparent;
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn.danger.sure {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--accent-ink);
      }
      .btn.sm {
        height: 28px;
        padding: 0 10px;
        font-size: 12px;
        border-radius: var(--r-sm);
      }
      .inp,
      .field {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .inp {
        height: 38px;
        padding: 0 12px;
        width: 100%;
        outline: 0;
        user-select: text;
      }
      .inp::placeholder,
      .field input::placeholder {
        color: var(--ink-3);
      }
      .inp:hover,
      .field:hover {
        border-color: var(--line-2);
      }
      .inp:focus,
      .field:focus-within {
        border-color: color-mix(in srgb, var(--space) 65%, var(--ink));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--space) 30%, transparent);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        color: var(--ink-3);
      }
      .field input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        user-select: text;
      }
      .ico {
        width: 22px;
        height: 22px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        overflow: hidden;
        font-weight: 600;
        font-size: 11px;
        background: var(--hover);
        color: var(--ink-2);
      }
      .ico img {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }
      .label {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-2);
      }
      kbd {
        font: 500 11px var(--f-text);
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid var(--line-2);
        color: var(--ink-2);
        background: var(--surface);
      }
      .seg {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: var(--r-md);
        background: var(--hover);
      }
      .seg button {
        flex: 1;
        height: 30px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: var(--ink-2);
        font-weight: 500;
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button.on {
        background: var(--raised);
        color: var(--ink);
        box-shadow: var(--shadow-sm);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        height: 30px;
        padding: 0 12px;
        border-radius: 99px;
        border: 1px solid var(--line-2);
        color: var(--ink-2);
        font-weight: 500;
      }
      .chip:hover {
        color: var(--ink);
        background: var(--hover);
      }
      .chip.on {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        text-align: left;
      }
      .switch .t {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .switch small {
        color: var(--ink-2);
        font-size: 12px;
      }
      .track {
        width: 38px;
        height: 22px;
        border-radius: 99px;
        background: var(--line-2);
        position: relative;
        flex: none;
        transition: background 0.15s;
      }
      .track::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: var(--shadow-sm);
        transition: transform 0.18s var(--ease);
      }
      .switch[aria-checked="true"] .track {
        background: var(--accent);
      }
      .switch[aria-checked="true"] .track::after {
        transform: translateX(16px);
        background: var(--accent-ink);
      }

      /* ---------- custom native-window chrome ---------- */
      #titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 30px;
        display: flex;
        align-items: center;
        z-index: 100;
        background: var(--chrome);
        color: var(--ink);
      }
      #titlebar { gap:0; padding:0 6px; border:0; }
      .toolbar-sidebar { width:280px; height:100%; display:flex; align-items:center; flex:none; padding-left:4px; transition:width .18s var(--ease); }
      .toolbar-sidebar .ib { width:28px; height:28px; }
      .toolbar-content { min-width:0; height:100%; display:flex; align-items:center; gap:4px; flex:1; margin-left:12px; }
      #topNav { display:flex; align-items:center; gap:2px; flex:none; }
      #titlebar .ib { width:26px; height:26px; }
      .urlwrap { position:relative; display:flex; align-items:center; flex:1; min-width:80px; padding:0; }
      #url { width:100%; min-width:0; height:26px; text-align:left; padding:0 14px; padding-right:104px; }
      #url:focus { text-align:left; }
      body.compact .toolbar-sidebar { width:56px; justify-content:center; padding:0; }
      body.collapsed .toolbar-sidebar { width:32px; justify-content:center; padding:0; }
      body.collapsed .toolbar-content { margin-left:12px; }
      .window-controls { margin-left:auto; }
      .window-controls {
        height: 100%;
        display: flex;
        align-items: stretch;
        flex: none;
      }
      .window-control {
        width: 46px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-2);
        transition:
          background 0.12s,
          color 0.12s;
      }
      .window-control:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .window-control.close:hover {
        background: #c42b1c;
        color: white;
      }
      .min-glyph {
        width: 10px;
        height: 1px;
        background: currentColor;
      }
      .max-glyph {
        width: 9px;
        height: 9px;
        border: 1px solid currentColor;
        border-radius: 1px;
      }
      .close-glyph {
        width: 12px;
        height: 12px;
        position: relative;
      }
      .close-glyph:before,
      .close-glyph:after {
        content: "";
        position: absolute;
        left: 5px;
        top: 0;
        width: 1px;
        height: 12px;
        background: currentColor;
        transform: rotate(45deg);
      }
      .close-glyph:after {
        transform: rotate(-45deg);
      }
      /* ---------- sidebar column ---------- */
      #side {
        width: 280px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 40px 6px 8px 10px;
        gap: 10px;
        position: relative;
        transition: width 0.18s var(--ease);
      }
      body.compact #side { width:56px; padding:40px 6px 8px; gap:8px; }
      body.compact #side #favs,
      body.compact #side #pane,
      body.compact #side #dots,
      body.compact #side .vsep { display:none; }
      body.compact #side .foot { flex-direction:column; justify-content:flex-start; align-items:center; flex:1; padding:0; }
      body.collapsed #side { width:0; min-width:0; padding:0; gap:0; overflow:hidden; }
      body.collapsed #side > * { visibility:hidden; }
      body.collapsed #side #toast { display:none; }
      .bar {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .bar .grow {
        flex: 1;
      }
      #url {
        border-radius: var(--r-lg);
        background: color-mix(in srgb, var(--surface) 60%, transparent);
        border: 1px solid transparent;
        font-size: 13px;
        transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
      }
      #url:hover {
        background: var(--surface);
      }
      #url:focus {
        text-align: left;
        background: var(--surface);
        border-color: color-mix(in srgb, var(--space) 65%, var(--ink));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--space) 30%, transparent);
      }
      #addExt {
        position: absolute;
        right: 9px;
        top: 2px;
        height: 22px;
        padding: 0 8px;
        border-radius: 7px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 12px;
        font-weight: 500;
      }
      #addExt[hidden] {
        display: none;
      }
      #favs {
        display: grid;
        display:flex;
        flex-wrap:wrap;
        gap:6px;
        padding-right: 4px;
        border-radius: var(--r-lg);
        transition: background 0.12s;
      }
      #favs.empty {
        display: none;
      }
      .tile {
        flex:1 1 calc(25% - 5px);
        min-width:calc(25% - 5px);
        height: 46px;
        border-radius: var(--r-lg);
        background: color-mix(in srgb, var(--surface) 55%, transparent);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.12s;
      }
      .tile:hover {
        background: var(--surface);
      }
      .tile .ico {
        width: 24px;
        height: 24px;
        background: transparent;
      }
      .tile .ico img {
        width: 20px;
        height: 20px;
      }
      .tile.on {
        background: var(--raised);
        box-shadow:
          var(--shadow-sm),
          inset 0 0 0 1.5px color-mix(in srgb, var(--space) 80%, var(--ink));
      }
      .tile.idle .ico {
        opacity: 0.7;
      }

      #pane {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-right: 4px;
        min-height: 0;
        position: relative;
      }
      #pane::-webkit-scrollbar { width:6px; height:6px; }
      #pane::-webkit-scrollbar-track { background:transparent; }
      #pane::-webkit-scrollbar-thumb { background:color-mix(in srgb,var(--ink) 22%,transparent); border-radius:99px; }
      #pane::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb,var(--ink) 36%,transparent); }
      #pane::-webkit-scrollbar-button { display:none; width:0; height:0; }
      #pane { scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--ink) 24%,transparent) transparent; }
      .hdr {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 6px 8px;
        border-radius: var(--r-md);
        text-align: left;
        width: 100%;
        flex: none;
      }
      .hdr .chipi {
        width: 22px;
        height: 22px;
        border-radius: 0;
        background: transparent;
        color: var(--ink-2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        transition: background 0.2s;
      }
      .hdr b {
        font: 600 12px var(--f-display);
        letter-spacing: -0.005em;
        color: var(--ink-2);
      }
      .hdr small {
        color: var(--ink-3);
        font-size: 12px;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hdr .pen {
        color: var(--ink-3);
        opacity: 0;
        transition: opacity 0.12s;
      }
      .hdr:hover .pen {
        opacity: 1;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-radius: var(--r-md);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 34px;
        padding: 0 6px 0 8px;
        border-radius: var(--r-md);
        cursor: pointer;
        flex: none;
        position: relative;
        width: 100%;
        text-align: left;
        transition: background 0.1s;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.on {
        background: var(--raised);
        box-shadow:
          var(--shadow-sm),
          0 0 0 1px var(--line);
      }
      .row.idle .ttl {
        color: var(--ink-2);
      }
      .row .ttl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row.lift {
        opacity: 0.35;
      }
      .acts {
        display: none;
        gap: 0;
      }
      .row:hover .acts {
        display: flex;
      }
      .acts .ib {
        width: 24px;
        height: 24px;
      }
      .acts .ib svg {
        width: 14px;
        height: 14px;
      }
      .newtab {
        color: var(--ink-2);
      }
      .newtab .ico {
        background: transparent;
      }
      .newtab:hover {
        color: var(--ink);
      }

      /* the pinned line */
      .line {
        height: 15px;
        flex: none;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 2px;
      }
      .line::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 7px;
        height: 1px;
        background: var(--line-2);
        transition:
          background 0.12s,
          height 0.12s,
          top 0.12s;
      }
      .line span {
        position: relative;
        font-size: 11px;
        font-weight: 500;
        padding: 0 8px;
        border-radius: 99px;
        background: var(--chrome);
        color: var(--ink-2);
        opacity: 0;
        transition: opacity 0.12s;
      }
      .dragging .line::before {
        height: 2px;
        top: 6.5px;
        background: var(--line-2);
      }
      .line.hot::before {
        background: var(--space);
      }
      .line.hot span {
        opacity: 1;
        color: var(--ink);
      }
      .dragging,
      .dragging * {
        cursor: grabbing !important;
      }
      .dragging #pinned:empty {
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed var(--line-2);
        margin-bottom: 2px;
      }
      .dragging #pinned:empty::before {
        content: "Drop here to pin";
        color: var(--ink-3);
        font-size: 12px;
      }
      .dragging #favs.empty {
        display: grid;
      }
      .dragging #favs:empty {
        min-height: 46px;
        border: 1px dashed var(--line-2);
        align-items: center;
        justify-content: center;
        display: flex;
      }
      .dragging #favs:empty::before {
        content: "Drop here for a favorite";
        color: var(--ink-3);
        font-size: 12px;
      }
      .hot-zone {
        background: color-mix(
          in srgb,
          var(--space) 22%,
          transparent
        ) !important;
      }
      #ind {
        position: fixed;
        z-index: 40;
        background: var(--space);
        border-radius: 2px;
        pointer-events: none;
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--space) 25%, transparent);
      }
      #ind[hidden] {
        display: none;
      }
      .dghost {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        background: var(--raised);
        border-radius: var(--r-md);
        box-shadow:
          var(--shadow-lg),
          0 0 0 1px var(--line-2);
        opacity: 0.97;
        transform: scale(1.02);
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 8px;
        height: 34px;
      }
      .dghost .ttl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .foot {
        display: flex;
        align-items: center;
        gap: 2px;
        padding-right: 4px;
      }
      #dots {
        flex: 1;
        display: flex;
        gap: 2px;
        align-items: center;
        overflow-x: auto;
        min-width: 0;
        scrollbar-width: none;
      }
      .sp {
        min-width: 32px;
        height: 32px;
        border-radius: var(--r-md);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-2);
        position: relative;
        flex: none;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .sp:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .sp.on {
        background: var(--raised);
        color: var(--ink);
        box-shadow:
          var(--shadow-sm),
          0 0 0 1px var(--line);
      }
      .sp.on::after {
        content: "";
        position: absolute;
        bottom: 3px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--space);
      }
      .vsep {
        width: 1px;
        height: 16px;
        background: var(--line-2);
        margin: 0 5px;
        flex: none;
      }
      .l {
        animation: inL 0.22s var(--ease);
      }
      .r {
        animation: inR 0.22s var(--ease);
      }
      @keyframes inL {
        from {
          transform: translateX(32px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes inR {
        from {
          transform: translateX(-32px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      #toast {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 52px;
        padding: 10px 14px;
        border-radius: var(--r-md);
        background: var(--ink);
        color: var(--bg);
        font-size: 12px;
        box-shadow: var(--shadow-lg);
        opacity: 0;
        transform: translateY(6px);
        transition: 0.2s var(--ease);
        pointer-events: none;
        z-index: 60;
      }
      :root[data-theme="dark"] #toast {
        color: var(--black);
      }
      #toast.show {
        opacity: 1;
        transform: none;
      }

      /* ---------- stage: the area where the page normally is ---------- */
      #stage {
        position: fixed;
        left: 280px;
        top: 30px;
        right: 8px;
        bottom: 8px;
        border-radius: 8px;
        background: var(--stage);
        border: 1px solid var(--line);
        overflow: auto;
        animation: fade 0.18s ease;
      }
      body.compact #stage { left:56px; }
      body.collapsed #stage { left:0; }
      #stage[hidden] {
        display: none;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .center {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 19vh 28px 48px;
      }
      .w {
        width: min(560px, 100%);
      }

      /* start page */
      .mark {
        font: 600 52px/1 var(--f-display);
        letter-spacing: -0.045em;
        text-align: center;
        margin-bottom: 34px;
        display: flex;
        align-items: baseline;
        justify-content: center;
      }
      .mark i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--space);
        margin-left: 4px;
        transition: background 0.2s;
      }
      .nt .field {
        height: 50px;
        border-radius: 99px;
        padding: 0 20px;
        font-size: 15px;
        background: var(--surface);
      }
      .nt .field input {
        font-size: 15px;
      }
      .sites {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px 10px;
        margin-top: 36px;
      }
      @media (min-width: 900px) {
        .sites {
          grid-template-columns: repeat(8, 1fr);
        }
      }
      .site {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        padding: 10px 2px 8px;
        border-radius: var(--r-lg);
        cursor: pointer;
        min-width: 0;
        transition: background 0.12s;
      }
      .site:hover {
        background: var(--hover);
      }
      .site .ico {
        width: 46px;
        height: 46px;
        border-radius: 15px;
        font-size: 17px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--ink-2);
      }
      .site .ico img {
        width: 24px;
        height: 24px;
        border-radius: 4px;
      }
      .site .n {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: var(--ink-2);
      }
      .res {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .res .row {
        height: 42px;
        padding: 0 12px;
        gap: 12px;
      }
      .res .row.sel {
        background: var(--hover);
      }
      .res .sub {
        color: var(--ink-3);
        font-size: 12px;
        max-width: 45%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* dialogs */
      .dlg-wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }
      .dlg {
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 56px);
        width: min(440px, 100%);
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow-lg);
        animation: pop 0.2s var(--ease);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .dlg header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 18px 0 24px;
      }
      .dlg h2 {
        font-size: 17px;
      }
      .dlg header,
      .dlg footer {
        flex: none;
      }
      .dlg .body {
        overflow-y: auto;
        min-height: 0;
        padding: 18px 24px 6px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .dlg footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 18px 24px 22px;
      }
      .dlg footer .grow {
        flex: 1;
      }
      .fl {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .note {
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.55;
      }
      .row2 {
        display: flex;
        gap: 8px;
      }
      .namerow {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .bigchip {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--space);
        color: var(--on-space);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        transition: background 0.15s;
      }
      .icons {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 2px;
        max-height: 190px;
        overflow: auto;
      }
      .custom-space-icon {
        object-fit: contain;
        flex: none;
      }
      .icons button {
        height: 34px;
        border-radius: var(--r-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-2);
      }
      .icons button:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .icons button.on {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .picker {
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .wheel {
        width: 156px;
        height: 156px;
        border-radius: 50%;
        position: relative;
        flex: none;
        cursor: crosshair;
        touch-action: none;
        background: radial-gradient(
            circle closest-side,
            #fff,
            rgba(255, 255, 255, 0)
          ),
          conic-gradient(
            from 0deg,
            hsl(0 100% 50%),
            hsl(60 100% 50%),
            hsl(120 100% 50%),
            hsl(180 100% 50%),
            hsl(240 100% 50%),
            hsl(300 100% 50%),
            hsl(360 100% 50%)
          );
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      .wheel .shade {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #000;
        pointer-events: none;
      }
      .knob {
        position: absolute;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.25),
          0 2px 6px rgba(0, 0, 0, 0.3);
        pointer-events: none;
      }
      .wheel:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--space) 70%, var(--ink));
        outline-offset: 3px;
      }
      .pside {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      .swatches button {
        aspect-ratio: 1;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14);
        transition: transform 0.12s var(--ease);
      }
      .swatches button:hover {
        transform: scale(1.1);
      }
      .swatches button.on {
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.14),
          0 0 0 2px var(--raised),
          0 0 0 4px var(--ink);
      }
      .shade-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 22px;
        background: transparent;
        margin: 0;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 99px;
        background: linear-gradient(to right, var(--c0), var(--c1));
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        margin-top: -7px;
        border-radius: 50%;
        background: var(--c1);
        border: 3px solid #fff;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.25),
          0 2px 6px rgba(0, 0, 0, 0.3);
      }
      .hex {
        font-variant-numeric: tabular-nums;
        text-transform: lowercase;
        height: 34px;
      }
      .sect-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .ext {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 52px;
        border-top: 1px solid var(--line);
      }
      .ext .ico {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--surface);
      }
      .ext .ico img {
        width: 22px;
        height: 22px;
      }
      .ext .meta {
        flex: 1;
        min-width: 0;
      }
      .ext .meta b {
        display: block;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ext .meta small {
        color: var(--ink-3);
      }
      .empty-st {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 22px 0 8px;
        color: var(--ink-3);
      }
      .keys {
        display: flex;
        flex-direction: column;
      }
      .keys div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 34px;
        border-top: 1px solid var(--line);
        color: var(--ink-2);
      }
      .keys div:first-child {
        border-top: 0;
      }
      .keys span:last-child {
        display: flex;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <div id="titlebar" aria-label="Browser toolbar and window controls">
      <div class="toolbar-sidebar" id="sidebarToolbar"><div id="topNav"></div></div>
      <div class="toolbar-content" id="pageToolbar">
        <div id="pageNav"></div>
        <button id="copyLink" class="ib" title="Copy link" aria-label="Copy link"></button>
        <div class="urlwrap">
          <input id="url" placeholder="Search or enter address" spellcheck="false" autocomplete="off" />
          <button id="addExt" hidden>Add to poof</button>
        </div>
      </div>
      <div class="window-drag" id="window-drag" title="Drag to move window"></div>
      <div class="window-controls">
        <button
          class="window-control"
          id="winMin"
          title="Minimize"
          aria-label="Minimize"
        >
          <span class="min-glyph"></span>
        </button>
        <button
          class="window-control"
          id="winMax"
          title="Maximize"
          aria-label="Maximize"
        >
          <span class="max-glyph"></span>
        </button>
        <button
          class="window-control close"
          id="winClose"
          title="Close"
          aria-label="Close"
        >
          <span class="close-glyph"></span>
        </button>
      </div>
    </div>
    <div id="side">
      <div id="favs" class="empty"></div>
      <div id="pane">
        <button class="hdr" id="hdr"></button>
        <div id="pinned" class="list"></div>
        <div class="line" id="line"><span id="lineLbl"></span></div>
        <button class="row newtab" id="newtab"></button>
        <div id="tabs" class="list"></div>
      </div>
      <div class="foot" id="foot"></div>
      <div id="toast"></div>
    </div>
    <div id="stage" hidden></div>
    <div id="ind" hidden></div>

    <script>
      /*ICONS*/
      const $ = (id) => document.getElementById(id);
      const send = (o) => window.ipc.postMessage(JSON.stringify(o));
      const el = (t, c, x) => {
        const e = document.createElement(t);
        if (c) e.className = c;
        if (x != null) e.textContent = x;
        return e;
      };
      const NS = "http://www.w3.org/2000/svg";
      const svg = (set, n, s = 16) => {
        const e = document.createElementNS(NS, "svg");
        [
          ["viewBox", "0 0 24 24"],
          ["width", s],
          ["height", s],
          ["fill", "none"],
          ["stroke", "currentColor"],
          ["stroke-width", "1.75"],
          ["stroke-linecap", "round"],
          ["stroke-linejoin", "round"],
          ["aria-hidden", "true"],
        ].forEach(([k, v]) => e.setAttribute(k, v));
        e.innerHTML = set[n] || "";
        return e;
      };
      const ic = (n, s) => svg(ICONS, n, s);
      const sic = (n, s) => {
        if (typeof n === "string" && n.startsWith("svg:")) {
          const i = el("img", "custom-space-icon");
          i.src = "data:image/svg+xml;base64," + n.slice(4);
          i.width = s;
          i.height = s;
          i.alt = "";
          return i;
        }
        return svg(SPACE_ICONS, SPACE_ICONS[n] ? n : "house", s);
      };
      const ib = (n, tip, fn) => {
        const b = el("button", "ib");
        b.title = tip;
        b.setAttribute("aria-label", tip);
        b.append(ic(n));
        b.onclick = (e) => {
          e.stopPropagation();
          fn();
        };
        return b;
      };
      const btn = (cls, txt, fn) => {
        const b = el("button", "btn " + cls, txt);
        if (fn) b.onclick = fn;
        return b;
      };

      /* ---------- colors ---------- */
      /* The twelve logo colors from the palette. They read well on both beige and near-black. */
      const PRESETS = [
        "#d64933",
        "#fa8334",
        "#ea9010",
        "#56c876",
        "#4fb561",
        "#6dc5e2",
        "#23b5d3",
        "#a288b1",
        "#8c4dc0",
        "#da4167",
        "#e87461",
        "#831f32",
      ];
      const hex2rgb = (h) =>
        [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      const rgb2hex = (c) =>
        "#" +
        c.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
      function hsv2rgb(h, s, v) {
        const f = (n) => {
          const k = (n + h / 60) % 6;
          return (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))) * 255;
        };
        return [f(5), f(3), f(1)];
      }
      function rgb2hsv([r, g, b]) {
        r /= 255;
        g /= 255;
        b /= 255;
        const mx = Math.max(r, g, b),
          mn = Math.min(r, g, b),
          d = mx - mn;
        let h = 0;
        if (d) {
          h =
            mx === r
              ? ((g - b) / d) % 6
              : mx === g
                ? (b - r) / d + 2
                : (r - g) / d + 4;
          h *= 60;
          if (h < 0) h += 360;
        }
        return [h, mx ? d / mx : 0, mx];
      }
      const lum = ([r, g, b]) => {
        const f = (c) => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
      };
      const onColor = (h) => (lum(hex2rgb(h)) > 0.4 ? "#050505" : "#fffbe6");
      function applyColor(c) {
        const r = document.documentElement.style;
        r.setProperty("--space", c);
        r.setProperty("--on-space", onColor(c));
      }

      /* ---------- light / dark ---------- */
      const mq = matchMedia("(prefers-color-scheme: dark)");
      let pref = "system";
      function applyMode(p) {
        pref = p;
        document.documentElement.dataset.theme =
          p === "system" ? (mq.matches ? "dark" : "light") : p;
      }
      mq.addEventListener("change", () => applyMode(pref));
      applyMode("system");

      /* ---------- state ---------- */
      let S = null,
        prevIdx = -1,
        ov = null,
        EXTS = [],
        lastKey = "",
        pending = null,
        drag = null,
        noClick = false;
      const curSpace = () => S.spaces.find((x) => x.id === S.current);
      const letter = (t) =>
        ((t.title || t.label || t.url || "?").trim()[0] || "?").toUpperCase();
      function icon(t, guess) {
        const w = el("span", "ico");
        const fb = () => {
          w.textContent = letter(t);
        };
        let src = t.favicon;
        if (!src && guess) {
          try {
            src = new URL("/favicon.ico", t.url).href;
          } catch (e) {}
        }
        if (src) {
          const i = new Image();
          i.referrerPolicy = "no-referrer";
          i.draggable = false;
          i.onerror = () => {
            i.remove();
            fb();
          };
          i.src = src;
          w.appendChild(i);
        } else fb();
        return w;
      }
      const pretty = (u) => {
        try {
          const x = new URL(u);
          return x.host.replace(/^www\./, "");
        } catch (e) {
          return u || "";
        }
      };

      /* A command that changes what is shown: close any full-area view first. */
      function go(cmd) {
        if (ov) {
          ov = null;
          $("stage").hidden = true;
          send({ cmd: "overlay", open: false });
        }
        send(cmd);
      }
      function openView(name) {
        ov = name;
        $("stage").hidden = false;
        send({ cmd: "overlay", open: true });
        build(name);
      }
      function closeView() {
        applyColor(curSpace().color);
        if (!S || !S.active) {
          openView("newtab");
          return;
        }
        ov = null;
        $("stage").hidden = true;
        applyColor(curSpace().color);
        send({ cmd: "overlay", open: false });
      }

      /* ---------- static sidebar chrome ---------- */
      const collapseBtn = ib("panelLeftClose", "Collapse sidebar", () => {
        const collapsed = !document.body.classList.contains("collapsed");
        document.body.classList.toggle("collapsed", collapsed);
        collapseBtn.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
        collapseBtn.setAttribute("aria-label", collapseBtn.title);
        collapseBtn.replaceChildren(ic(collapsed ? "panelLeftOpen" : "panelLeftClose"));
        send({ cmd: "sidebar_collapsed", collapsed });
      });
      $("topNav").append(collapseBtn);
      $("pageNav").append(
        ib("back", "Back", () => send({ cmd: "back" })),
        ib("fwd", "Forward", () => send({ cmd: "forward" })),
        ib("reload", "Reload", () => send({ cmd: "reload" })),
      );
      $("copyLink").append(ic("link", 15));
      $("copyLink").onclick = async () => {
        const value = S && S.url ? S.url : "";
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
          window.__toast("Link copied");
        } catch (_) {
          const tmp = el("textarea");
          tmp.value = value;
          tmp.style.position = "fixed";
          tmp.style.opacity = "0";
          document.body.append(tmp);
          tmp.select();
          try { document.execCommand("copy"); window.__toast("Link copied"); }
          finally { tmp.remove(); }
        }
      };
      $("pageToolbar").append(ib("puzzle", "Extensions", () => openView("ext")));
      $("winMin").onclick = () => send({ cmd: "window_minimize" });
      $("winMax").onclick = () => send({ cmd: "window_toggle_maximize" });
      $("winClose").onclick = () => send({ cmd: "window_close" });
      $("titlebar").addEventListener("dblclick", (e) => {
        if (e.target.closest(".window-controls")) return;
        send({ cmd: "window_toggle_maximize" });
      });
      $("window-drag").addEventListener("pointerdown", (e) => {
        if (e.button === 0) send({ cmd: "window_drag" });
      });
      {
        const w = el("span", "ico");
        w.append(ic("plus", 15));
        $("newtab").append(w, el("span", "ttl", "New tab"));
      }
      $("newtab").onclick = () => openView("newtab");
      $("foot").append(
        el("div"),
        ib("plus", "New space", () => openView("space:add")),
        ib("settings", "Settings", () => openView("settings")),
      );
      $("foot").firstChild.id = "dots";
      $("hdr").onclick = () => openView("space:edit");

      function row(t, kind) {
        const r = el(
          "div",
          "row" + (S.active === t.id ? " on" : "") + (t.loaded ? "" : " idle"),
        );
        r.dataset.id = t.id;
        r.append(
          icon(t),
          el("span", "ttl", t.title || pretty(t.url) || "New tab"),
        );
        const a = el("span", "acts");
        a.append(
          ib(
            kind === "pin" ? "unpin" : "pin",
            kind === "pin" ? "Unpin" : "Pin",
            () =>
              send({ cmd: kind === "pin" ? "unpin_tab" : "pin_tab", id: t.id }),
          ),
          ib("star", "Add to favorites", () =>
            send({ cmd: "fav_tab", id: t.id }),
          ),
          ib("x", kind === "tab" ? "Close" : "Unload", () =>
            send({ cmd: "close_tab", id: t.id }),
          ),
        );
        r.append(a);
        r.onclick = () => {
          if (noClick) return;
          go({ cmd: "select_tab", id: t.id });
        };
        r.onauxclick = (e) => {
          if (e.button === 1) send({ cmd: "close_tab", id: t.id });
        };
        r.onpointerdown = (e) => watchDrag(e, r, t, kind);
        return r;
      }

      window.__setState = (s) => {
        if (drag) {
          pending = s;
          return;
        }
        const key = JSON.stringify(s);
        if (key === lastKey) return;
        lastKey = key;
        S = s;
        document.body.classList.toggle("collapsed", !!s.sidebar_collapsed);
        document.body.classList.toggle("compact", !!s.sidebar_compact && !s.sidebar_collapsed);
        const isCollapsed = !!s.sidebar_collapsed;
        collapseBtn.title = isCollapsed ? "Expand sidebar" : "Collapse sidebar";
        collapseBtn.setAttribute("aria-label", collapseBtn.title);
        collapseBtn.replaceChildren(ic(isCollapsed ? "panelLeftOpen" : "panelLeftClose"));
        const idx = s.spaces.findIndex((x) => x.id === s.current),
          sp = s.spaces[idx];
        if (pref !== s.theme) applyMode(s.theme || "system");
        if (!ov || !ov.startsWith("space")) applyColor(sp.color);
        const prof = s.profiles.find((p) => p.id === sp.profile_id);
        const chipi = el("span", "chipi");
        chipi.append(sic(sp.icon, 15));
        const pen = el("span", "pen");
        pen.append(ic("pencil", 14));
        $("hdr").title = "Edit space";
        $("hdr").replaceChildren(
          chipi,
          el("b", null, sp.name),
          pen,
        );
        $("favs").replaceChildren(
          ...s.favorites.map((t) => {
            const d = el(
              "div",
              "tile" +
                (s.active === t.id ? " on" : "") +
                (t.loaded ? "" : " idle"),
            );
            d.dataset.id = t.id;
            d.title = (t.title || t.url) + "\nRight-click to remove";
            d.append(icon(t));
            d.onclick = () => go({ cmd: "select_tab", id: t.id });
            d.oncontextmenu = (e) => {
              e.preventDefault();
              send({ cmd: "unfav_tab", id: t.id });
            };
            return d;
          }),
        );
        $("favs").classList.toggle("empty", !s.favorites.length);
        $("pinned").replaceChildren(...s.pinned.map((t) => row(t, "pin")));
        $("tabs").replaceChildren(...s.tabs.map((t) => row(t, "tab")));
        const dots = [];
        let lastP = null;
        s.spaces.forEach((x) => {
          if (lastP && lastP !== x.profile_id) dots.push(el("i", "vsep"));
          const b = el("button", "sp" + (x.id === s.current ? " on" : ""));
          b.append(sic(x.icon, 17));
          const pn =
            (s.profiles.find((p) => p.id === x.profile_id) || {}).name || "";
          b.title = x.name + (pn ? " · " + pn : "");

      /* ---------- drag to pin / unpin / favorite / reorder ---------- */
      function watchDrag(e, row, t, kind) {
        if (e.button !== 0 || e.target.closest(".acts")) return;
        const x0 = e.clientX,
          y0 = e.clientY,
          ox = e.clientX - row.getBoundingClientRect().left;
        let on = false;
        const mv = (ev) => {
          if (!on) {
            if (Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;
            on = true;
            beginDrag(row, t, kind, ox);
          }
          updateDrag(ev);
        };
        const up = (ev) => {
          removeEventListener("pointermove", mv);
          removeEventListener("pointerup", up);
          removeEventListener("pointercancel", up);
          if (on) {
            noClick = true;
            setTimeout(() => (noClick = false), 0);
            endDrag(ev.type === "pointerup");
          }
        };
        addEventListener("pointermove", mv);
        addEventListener("pointerup", up);
        addEventListener("pointercancel", up);
      }
      function beginDrag(row, t, kind, ox) {
        const g = row.cloneNode(false);
        g.className = "dghost";
        g.style.width = row.offsetWidth + "px";
        g.append(
          icon(t),
          el("span", "ttl", t.title || pretty(t.url) || "New tab"),
        );
        document.body.append(g);
        drag = { id: t.id, kind, row, ghost: g, ox, zone: null, idx: 0 };
        row.classList.add("lift");
        document.body.classList.add("dragging");
      }
      function overRect(r, x, y, pad = 0) {
        return (
          x >= r.left - pad &&
          x <= r.right + pad &&
          y >= r.top - pad &&
          y <= r.bottom + pad
        );
      }
      function updateDrag(ev) {
        const d = drag,
          x = ev.clientX,
          y = ev.clientY;
        d.ghost.style.left = x - d.ox + "px";
        d.ghost.style.top = y - 17 + "px";
        const pane = $("pane"),
          pr = pane.getBoundingClientRect();
        if (y < pr.top + 28) pane.scrollTop -= 8;
        else if (y > pr.bottom - 28) pane.scrollTop += 8;
        const fr = $("favs").getBoundingClientRect(),
          lr = $("line").getBoundingClientRect();
        let zone = null;
        if (x > 290 || x < 0 || y < 0 || y > innerHeight)
          zone = null; /* left the sidebar: cancel */
        else if (overRect(fr, x, y, 4) && y < pr.top - 4) zone = "fav";
        else zone = y < lr.top + lr.height / 2 ? "pinned" : "tab";
        let idx = 0,
          ref = null,
          after = false,
          box = null;
        if (zone === "fav") {
          const tiles = [...$("favs").children].filter((c) => c !== d.row);
          tiles.forEach((c) => {
            const r = c.getBoundingClientRect();
            if (
              r.bottom < y ||
              (y <= r.bottom && y >= r.top && r.left + r.width / 2 < x)
            )
              idx++;
          });
          ref = tiles[idx] || tiles[tiles.length - 1];
          after = !tiles[idx];
          if (ref) {
            const r = ref.getBoundingClientRect();
            box = {
              left: after ? r.right + 2 : r.left - 4,
              top: r.top + 4,
              width: 2,
              height: r.height - 8,
            };
          }
        } else if (zone) {
          const list = $(zone === "pinned" ? "pinned" : "tabs");
          const rows = [...list.children].filter((c) => c !== d.row);
          rows.forEach((c) => {
            const r = c.getBoundingClientRect();
            if (r.top + r.height / 2 < y) idx++;
          });
          const lb = list.getBoundingClientRect();
          if (rows.length) {
            const r = (
              rows[idx] || rows[rows.length - 1]
            ).getBoundingClientRect();
            box = {
              left: lb.left + 6,
              top: rows[idx] ? r.top - 2 : r.bottom + 1,
              width: lb.width - 12,
              height: 2,
            };
          }
        }
        d.zone = zone;
        d.idx = idx;
        const ind = $("ind");
        if (box) {
          ind.hidden = false;
          Object.assign(ind.style, {
            left: box.left + "px",
            top: box.top + "px",
            width: box.width + "px",
            height: box.height + "px",
          });
        } else ind.hidden = true;
        const free = (n) => ![...$(n).children].some((c) => c !== d.row);
        $("pinned").classList.toggle(
          "hot-zone",
          zone === "pinned" && free("pinned"),
        );
        $("favs").classList.toggle("hot-zone", zone === "fav" && free("favs"));
        const changing =
          (zone === "pinned" && d.kind !== "pin") ||
          (zone === "tab" && d.kind === "pin");
        $("line").classList.toggle("hot", changing);
        $("lineLbl").textContent =
          zone === "pinned" ? "Release to pin" : "Release to unpin";
      }
      function endDrag(drop) {
        const d = drag;
        drag = null;
        d.ghost.remove();
        d.row.classList.remove("lift");
        document.body.classList.remove("dragging");
        $("ind").hidden = true;
        $("line").classList.remove("hot");
        $("pinned").classList.remove("hot-zone");
        $("favs").classList.remove("hot-zone");
        if (drop && d.zone) {
          const to =
            d.zone === "pinned" ? "pinned" : d.zone === "fav" ? "fav" : "tab";
          send({ cmd: "move_tab", id: d.id, to, index: d.idx });
        }
        if (pending) {
          const p = pending;
          pending = null;
          lastKey = "";
          window.__setState(p);
        }
      }
      addEventListener(
        "keydown",
        (e) => {
          if (e.key === "Escape" && drag) {

          }
        },
        true,
      );

      /* ---------- start page ---------- */
      const looksUrl = (q) =>

      window.__openNew = () => openView("newtab");
      function siteTile(s) {
        const d = el("div", "site");

      function buildNewTab(v) {

        function showHome() {
          body.replaceChildren();

            ...S.suggestions.filter((x) => !x.popular),

            sub: "",
            run: () => go({ cmd: "new_tab", input: txt }),
          });
          [...S.favorites, ...S.pinned, ...S.tabs]
            .filter((t) =>
              ((t.title || "") + " " + t.url).toLowerCase().includes(ql),
            )
            .slice(0, 4)
            .forEach((t) =>
              items.push({
                fav: t,
                t: t.title || pretty(t.url),

                run: () => go({ cmd: "select_tab", id: t.id }),
              }),
            );
          S.suggestions
            .filter((s) => (s.label + " " + s.url).toLowerCase().includes(ql))
            .slice(0, 5)
            .forEach((s) =>
              items.push({
                fav: s,
                t: s.label,
                sub: s.url.replace(/^https?:\/\//, "").replace(/\/$/, ""),
                run: () => go({ cmd: "new_tab", input: s.url }),
              }),
            );
          sel = 0;
          paint();
        }
        function paint() {
          const list = el("div", "res");
          items.forEach((it, i) => {
            const r = el("div", "row" + (i === sel ? " sel" : ""));
            if (it.ic) {
              const w = el("span", "ico");
              w.append(ic(it.ic, 14));
              r.append(w);
            } else r.append(icon(it.fav, true));
            r.append(el("span", "ttl", it.t), el("span", "sub", it.sub));
            if (i === sel) r.append(el("kbd", null, "Enter"));
            r.onclick = () => run(it);
            r.onmouseenter = () => {
              if (sel !== i) {
                sel = i;
                [...list.children].forEach((c, j) =>
                  c.classList.toggle("sel", j === i),

        q.addEventListener("input", () => {
          q.value.trim() ? showResults(q.value.trim()) : showHome();
        });
        q.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" && items.length) {
            e.preventDefault();
            sel = (sel + 1) % items.length;
            paint();
          } else if (e.key === "ArrowUp" && items.length) {
            e.preventDefault();
            sel = (sel - 1 + items.length) % items.length;
            paint();
          } else if (e.key === "Enter" && q.value.trim()) run(items[sel]);

        setTimeout(() => q.focus(), 30);

      /* ---------- space editor ---------- */
      function buildSpace(v, mode) {
        const sp = curSpace(),
          add = mode === "add";
        const used = new Set(S.spaces.map((x) => x.color.toLowerCase()));
        let color = add
          ? PRESETS.find((c) => !used.has(c)) || PRESETS[5]
          : sp.color.toLowerCase();
        let icn = add
          ? "sparkles"
          : SPACE_ICONS[sp.icon] || sp.icon.startsWith("svg:")
            ? sp.icon
            : "house";
        let [H, SA, V] = rgb2hsv(hex2rgb(color));
        V = Math.max(V, 0.2);
        applyColor(color);

        const chip = el("span", "bigchip");
        const name = el("input", "inp");
        name.value = add ? "" : sp.name;
        name.maxLength = 40;
        name.placeholder = "Name this space";
        name.setAttribute("aria-label", "Space name");
        const nrow = el("div", "namerow");

        const grid = el("div", "icons");
        const iconSearch = el("input", "inp");
        iconSearch.placeholder = "Search Lucide icons";
        iconSearch.setAttribute("aria-label", "Search icons");
        const upload = el("input");
        upload.type = "file";
        upload.accept = ".svg,image/svg+xml";
        upload.hidden = true;
        const uploadBtn = btn("sm ghost", "Upload SVG", () => upload.click());
        const paintIcons = () => {
          const q = iconSearch.value.trim().toLowerCase();
          const names = Object.keys(SPACE_ICONS).filter((n) => n.includes(q));
          grid.replaceChildren(
            ...names.map((n) => {
              const b = el("button", n === icn ? "on" : "");
              b.type = "button";
              b.title = n.replace(/-/g, " ");
              b.setAttribute("aria-label", n);
              b.append(sic(n, 18));
              b.onclick = () => {
                icn = n;
                sync();

            }),
          );
        };
        iconSearch.addEventListener("input", paintIcons);
        uploadBtn.onclick = () => upload.click();
        upload.addEventListener("change", async () => {
          const f = upload.files && upload.files[0];
          if (!f) return;
          if (f.size > 16384) {
            window.__toast("SVG must be 16 KB or smaller");
            upload.value = "";
            return;
          }
          try {
            const source = await f.text(),
              doc = new DOMParser().parseFromString(source, "image/svg+xml");
            if (
              doc.querySelector("parsererror") ||
              doc.documentElement.localName !== "svg"
            )
              throw Error("Invalid SVG");
            const allowed = new Set([
              "svg",
              "g",
              "path",
              "circle",
              "rect",
              "line",
              "polyline",
              "polygon",
              "ellipse",
            ]);
            const attrs = new Set([
              "viewBox",
              "xmlns",
              "d",
              "cx",
              "cy",
              "r",
              "x",
              "y",
              "width",
              "height",
              "rx",
              "ry",
              "x1",
              "y1",
              "x2",
              "y2",
              "points",
              "fill",
              "stroke",
              "stroke-width",
              "stroke-linecap",
              "stroke-linejoin",
              "fill-rule",
              "clip-rule",
            ]);
            const root = doc.documentElement;
            for (const node of [...root.querySelectorAll("*")].reverse()) {
              if (!allowed.has(node.localName)) node.remove();
              else
                for (const a of [...node.attributes])
                  if (!attrs.has(a.name)) node.removeAttribute(a.name);
            }
            for (const a of [...root.attributes])
              if (!attrs.has(a.name)) root.removeAttribute(a.name);
            root.setAttribute(
              "viewBox",
              root.getAttribute("viewBox") || "0 0 24 24",
            );
            root.setAttribute("xmlns", "http://www.w3.org/2000/svg");
            const clean = new XMLSerializer().serializeToString(root);
            if (
              clean.length > 6144 ||
              /<script|javascript:|url\(|on[a-z]+=/i.test(clean)
            )
              throw Error("Unsafe or oversized SVG");
            icn = "svg:" + btoa(unescape(encodeURIComponent(clean)));
            sync();
          } catch (e) {
            window.__toast(
              "Could not use that SVG. Use simple paths and shapes.",
            );
          } finally {
            upload.value = "";
          }
        });

        const W = 156,
          R = W / 2;
        const wheel = el("div", "wheel"),
          shade = el("div", "shade"),
          knob = el("div", "knob");
        wheel.tabIndex = 0;
        wheel.setAttribute("role", "slider");
        wheel.setAttribute("aria-label", "Color");
        shade.className = "shade";
        wheel.append(shade, knob);
        const sw = el("div", "swatches");

        function fromHsv() {
          color = rgb2hex(hsv2rgb(H, SA, V));

        function setHex(c) {

          [H, SA, V] = rgb2hsv(hex2rgb(color));
          V = Math.max(V, 0.2);
          sync();
        }
        function sync(skipHex) {
          applyColor(color);
          chip.replaceChildren(sic(icn, 20));
          const a = (H * Math.PI) / 180;
          knob.style.left = R + Math.sin(a) * SA * R + "px";
          knob.style.top = R - Math.cos(a) * SA * R + "px";
          knob.style.background = color;
          shade.style.opacity = 1 - V;
          range.value = Math.round(V * 100);
          range.style.setProperty("--c0", rgb2hex(hsv2rgb(H, SA, 0.2)));

          [...sw.children].forEach((b, i) =>

          );
          [...grid.children].forEach((b) =>

        pside.append(sw, shRow);
        const picker = el("div", "picker");
        picker.append(wheel, pside);
        const hexRow = el("div", "row2");
        hex.style.maxWidth = "120px";
        hexRow.append(hex);

        const iconTools = el("div", "row2");
        iconTools.append(iconSearch, uploadBtn);
        const body = [
          nrow,
          field("Icon", iconTools, grid),

        ];
        let prof, np;
        if (add) {

          prof = {

          paintChips();
          body.push(

              ),

        const save = () => {

      /* ---------- extensions ---------- */
      window.__setExts = (l) => {
        EXTS = l;

      function paintExts() {
        const box = $("extlist");
        if (!box) return;
        if (!EXTS.length) {
          const e = el("div", "empty-st");
          e.append(ic("puzzle", 26), el("span", null, "No extensions yet"));
          box.replaceChildren(e);
          return;
        }
        box.replaceChildren(
          ...EXTS.map((x) => {
            const r = el("div", "ext");
            r.append(icon({ favicon: x.icon, title: x.name }));
            const m = el("div", "meta");
            m.append(
              el("b", null, x.name),
              el("small", null, "Version " + x.version),
            );
            r.append(m);
            r.append(
              btn("sm ghost danger", "Remove", () =>
                send({ cmd: "remove_ext", dir: x.dir }),
              ),
            );
            return r;
          }),
        );
      }
      function buildExt(v) {
        const id = el("input", "inp");
        id.placeholder = "Chrome Web Store link or extension ID";
        id.setAttribute("aria-label", "Chrome Web Store link or extension ID");
        const add = btn("primary", "Install", () => {
          if (id.value.trim()) {
            send({ cmd: "install_ext", input: id.value });
            id.value = "";
          }
        });
        id.addEventListener("keydown", (e) => {
          if (e.key === "Enter") add.click();
        });
        const inst = el("div", "row2");
        inst.append(id, add);
        const browse = btn("sm ghost", "Browse the Chrome Web Store", () =>
          go({ cmd: "new_tab", input: "https://chromewebstore.google.com/" }),
        );
        browse.prepend(ic("external", 14));
        const bw = el("div", "row2");
        bw.append(browse);
        const list = el("div");
        list.id = "extlist";
        dialog(v, "Extensions", [
          field(null, inst, bw),
          list,
          el(
            "div",
            "note",
            "On any Web Store page an “Add to poof” button appears in the address bar. Extensions run in every profile. Toolbar icons and popups are not available in this engine (WebView2), but background logic and content scripts, like ad blocking, work.",
          ),
        ]);
        paintExts();
        send({ cmd: "list_ext" });
        setTimeout(() => id.focus(), 30);
      }

      /* ---------- settings ---------- */
      function buildSettings(v) {
        const seg = el("div", "seg");
        [
          ["system", "monitor", "System"],
          ["light", "sun", "Light"],
          ["dark", "moon", "Dark"],
        ].forEach(([k, i, l]) => {
          const b = el("button", S.theme === k ? "on" : "");
          b.type = "button";
          b.append(ic(i, 15), el("span", null, l));
          b.onclick = () => {
            S.theme = k;
            lastKey = "";
            applyMode(k);
            send({ cmd: "set_theme", theme: k });
            [...seg.children].forEach((c, j) =>
              c.classList.toggle(
                "on",
                j === ["system", "light", "dark"].indexOf(k),
              ),
            );
          };
          seg.append(b);
        });
        const compact = el("button", "switch");
        compact.type = "button";
        compact.setAttribute("role", "switch");
        compact.setAttribute("aria-checked", String(!!S.sidebar_compact));
        const compactText = el("span", "t");
        compactText.append(el("span", null, "Compact sidebar"), el("small", null, "Keep an icon-only sidebar when it is open"));
        compact.append(compactText, el("span", "track"));
        compact.onclick = () => {
          const on = compact.getAttribute("aria-checked") !== "true";
          compact.setAttribute("aria-checked", String(on));
          S.sidebar_compact = on;
          document.body.classList.toggle("compact", on && !document.body.classList.contains("collapsed"));
          send({ cmd: "sidebar_compact", compact: on });
        };
        const sw = el("button", "switch");
        sw.type = "button";
        sw.setAttribute("role", "switch");
        sw.setAttribute("aria-checked", String(!!S.auto_pip));
        const t = el("span", "t");
        t.append(
          el("span", null, "Picture in picture"),
          el("small", null, "Pop out a playing video when you leave its tab"),
        );
        sw.append(t, el("span", "track"));
        sw.onclick = () => {
          const on = sw.getAttribute("aria-checked") !== "true";
          sw.setAttribute("aria-checked", String(on));
          S.auto_pip = on;
          send({ cmd: "set_auto_pip", on });
        };
        const keys = el("div", "keys");
        [
          ["New tab", ["Ctrl", "T"]],
          ["Address bar", ["Ctrl", "L"]],
          ["Close tab", ["Ctrl", "W"]],
          ["Switch space", ["Ctrl", "Alt", "←", "→"]],
        ].forEach(([n, k]) => {
          const r = el("div");
          const kk = el("span");
          k.forEach((x) => kk.append(el("kbd", null, x)));
          r.append(el("span", null, n), kk);
          keys.append(r);
        });
        dialog(v, "Settings", [
          field("Appearance", seg),
          field("Browsing", sw),
          field("Sidebar", compact),
          field("Shortcuts", keys),
        ]);
      }

      function build(name) {
        const v = $("stage");
        if (name === "newtab") buildNewTab(v);
        else if (name === "ext") buildExt(v);
        else if (name === "settings") buildSettings(v);
        else if (name.startsWith("space")) buildSpace(v, name.split(":")[1]);
      }

      window.__toast = (m) => {
        const t = $("toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(t._h);
        t._h = setTimeout(() => t.classList.remove("show"), 4200);
      };

      /* ---------- swipe between spaces (sidebar only) ---------- */
      let acc = 0,
        lock = 0,
        tmr;
      $("side").addEventListener(
        "wheel",
        (e) => {
          if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
          e.preventDefault();
          const now = performance.now();
          if (now < lock) return;
          acc += e.deltaX;
          clearTimeout(tmr);
          tmr = setTimeout(() => (acc = 0), 150);
          if (Math.abs(acc) >= 100) {
            go({ cmd: "cycle_space", dir: acc > 0 ? 1 : -1 });
            acc = 0;
            lock = now + 450;
          }
        },
        { passive: false },
      );
      let sx = null;
      $("side").addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "mouse") sx = e.clientX;
      });
      $("side").addEventListener("pointerup", (e) => {
        if (sx != null) {
          const dx = e.clientX - sx;
          if (Math.abs(dx) > 70)
            go({ cmd: "cycle_space", dir: dx < 0 ? 1 : -1 });
          sx = null;
        }
      });
      addEventListener("keydown", (e) => {
        if (e.key === "Escape" && ov && !url.matches(":focus")) {
          closeView();
          return;
        }
        if (!e.ctrlKey) return;
        const k = e.key.toLowerCase();
        if (e.altKey && e.key === "ArrowRight")
          go({ cmd: "cycle_space", dir: 1 });
        else if (e.altKey && e.key === "ArrowLeft")
          go({ cmd: "cycle_space", dir: -1 });
        else if (k === "t") {
          e.preventDefault();
          openView("newtab");
        } else if (k === "l") {
          e.preventDefault();
          window.__focusUrl();
        } else if (k === "w" && S && S.active) {
          e.preventDefault();
          send({ cmd: "close_tab", id: S.active });
        }
      });
      send({ cmd: "ready" });
    </script>
  </body>
</html>
