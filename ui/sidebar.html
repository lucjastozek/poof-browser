<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>poof</title>
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src http: https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    /*STYLES*/
  </head>
  <body>
    <div id="titlebar" aria-label="Browser toolbar and window controls">
      <div class="toolbar-sidebar" id="sidebarToolbar">
        <div id="topNav"></div>
      </div>
      <div class="toolbar-content" id="pageToolbar">
        <div id="pageNav"></div>
        <button
          id="copyLink"
          class="ib"
          title="Copy link"
          aria-label="Copy link"
        ></button>
        <div class="urlwrap">
          <input
            id="url"
            placeholder="Search or enter address"
            spellcheck="false"
            autocomplete="off"
          />
          <button id="addExt" hidden>Add to poof</button>
        </div>
      </div>
      <div
        class="window-drag"
        id="window-drag"
        title="Drag to move window"
      ></div>
      <div class="window-controls">
        <button
          class="window-control"
          id="winMin"
          title="Minimize"
          aria-label="Minimize"
        >
          <span class="min-glyph"></span>
        </button>
        <button
          class="window-control"
          id="winMax"
          title="Maximize"
          aria-label="Maximize"
        >
          <span class="max-glyph"></span>
        </button>
        <button
          class="window-control close"
          id="winClose"
          title="Close"
          aria-label="Close"
        >
          <span class="close-glyph"></span>
        </button>
      </div>
    </div>
    <div id="web-surface" aria-hidden="true"></div>
    <div id="side">
      <div
        id="side-resize"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <div id="favs" class="empty"></div>
      <div id="pane">
        <button class="hdr" id="hdr"></button>
        <div id="pinned" class="list"></div>
        <div class="line" id="line"><span id="lineLbl"></span></div>
        <button class="row newtab" id="newtab"></button>
        <div id="tabs" class="list"></div>
      </div>
      <div class="foot" id="foot"></div>
      <div id="toast"></div>
    </div>
    <div id="stage" hidden></div>
    <div id="ind" hidden></div>

    <script>
      /*ICONS*/
    </script>
    <script>
      /*CORE*/
    </script>
    <script>
      /*SIDEBAR*/
    </script>
    <script>
      /*START_PAGE*/
    </script>
    <script>
      /*DIALOGS*/
    </script>
    <script>
      /*SETTINGS*/
    </script>
    <script>
      /*HISTORY*/
    </script>
  </body>
</html>
