<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>poof</title>
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    /*STYLES*/
  </head>
  <body>
    <div id="titlebar" aria-label="Window title and controls">
      <span class="popup-title" id="popupTitle"></span>
      <div class="window-drag" id="window-drag"></div>
      <div class="window-controls">
        <button class="window-control" id="winMin" title="Minimize" aria-label="Minimize">
          <span class="min-glyph"></span>
        </button>
        <button class="window-control" id="winMax" title="Maximize" aria-label="Maximize">
          <span class="max-glyph"></span>
        </button>
        <button class="window-control close" id="winClose" title="Close" aria-label="Close">
          <span class="close-glyph"></span>
        </button>
      </div>
    </div>
    /*SCRIPTS*/
  </body>
</html>
